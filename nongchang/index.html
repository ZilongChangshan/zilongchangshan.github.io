<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置农场</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="top-bar">
            <div class="level-badge">等级 <span id="level">1</span></div>
            <h1 class="game-title">放置农场</h1>
            <div class="currency">金币 <span id="gold">0</span></div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar">
                <div id="exp-fill" class="progress-fill" style="width: 0%;"></div>
            </div>
            <div class="progress-text"><span id="exp">0</span>/<span id="max-exp">100</span></div>
        </div>

        <!-- Main Game Area (Grid) -->
        <main id="farm-grid" class="farm-grid">
            <!-- Plots will be generated by JS -->
        </main>

        <!-- Bottom UI -->
        <div class="bottom-panel">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="shop">商店</button>
                <button class="tab-btn" data-tab="stats">统计</button>
                <button class="tab-btn" data-tab="achievements">成就</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Shop Content -->
                <div id="shop-tab" class="tab-pane active">
                    <div id="shop-items" class="shop-list">
                        <!-- Shop items generated by JS -->
                    </div>
                </div>

                <!-- Stats Content -->
                <div id="stats-tab" class="tab-pane">
                    <p>暂无统计数据</p>
                </div>

                <!-- Achievements Content -->
                <div id="achievements-tab" class="tab-pane">
                    <p>暂无成就</p>
                </div>
            </div>

            <!-- Ad Button -->
            <button class="ad-btn" id="btn-ad">看广告领补贴</button>
        </div>
    </div>

    <div id="message-toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
