<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放置农场</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --text-color: #fff;
            --accent-color: #4CAF50;
            --highlight-color: #fff;
            --gold-color: #FFD700;
            --progress-bg: #333;
            --progress-fill: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevent scrolling on body */
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile app style width */
            display: flex;
            flex-direction: column;
            height: 100vh; /* Takes exactly full viewport height */
            background-color: #000;
            overflow: hidden;
        }

        /* Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #000;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            flex-shrink: 0;
            height: 60px; /* Fixed height for consistent layout */
        }

        .level-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 80px;
        }

        .level-badge {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.2;
        }

        .level-exp-bar {
            width: 100%;
            height: 4px;
            background-color: var(--progress-bg);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .level-exp-fill {
            height: 100%;
            background-color: var(--accent-color); /* Green progress */
            transition: width 0.3s ease;
        }

        .level-exp-text {
            font-size: 0.6rem;
            color: #888;
            margin-top: 1px;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            flex-grow: 1;
        }

        .currency {
            font-size: 1rem;
            font-weight: bold;
            color: var(--gold-color);
            min-width: 60px;
            text-align: right;
        }

        /* Farm Grid */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            gap: 4px;
            padding: 8px;
            height: 35vh; /* Reduced from 50vh */
            flex-shrink: 0;
            overflow: hidden; /* Prevent scrolling */
        }

        .plot-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding: 1px;
            transition: transform 0.1s, border-color 0.2s;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .plot-card.locked {
            background-color: #0d0d0d;
            border-style: dashed;
            border-color: #444;
            opacity: 0.7;
        }

        .lock-icon {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .lock-text {
            font-size: 0.5rem;
            color: #666;
            text-align: center;
        }

        .plot-card:active {
            transform: scale(0.95);
        }

        .plot-card.selected {
            border-color: var(--highlight-color);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .plot-level {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.6rem;
            background-color: rgba(0,0,0,0.6);
            padding: 1px 3px;
            border-radius: 2px;
            color: #ccc;
            pointer-events: none;
        }

        .crop-emoji {
            font-size: 1.8rem;
            margin-bottom: 2px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 0.6rem;
            color: #aaa;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Plot Progress Bar */
        .plot-progress-bar {
            width: 90%;
            height: 3px;
            background-color: var(--progress-bg);
            border-radius: 1px;
            margin-top: 2px;
            overflow: hidden;
        }

        .plot-progress-fill {
            height: 100%;
            background-color: var(--progress-fill);
            width: 0%;
            transition: width 0.5s linear; /* Smooth fill */
        }

        /* Floating Text Animation */
        .floating-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--gold-color);
            font-weight: bold;
            font-size: 1rem;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -150%); }
        }


        /* Bottom Panel */
        .bottom-panel {
            background-color: #111;
            border-top: 1px solid var(--border-color);
            padding: 0;
            display: flex;
            flex-direction: column;
            flex-grow: 1; /* Takes the remaining space */
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
        }

        .tab-btn:hover {
            color: #ddd;
        }

        .tab-btn.active {
            color: var(--text-color);
            border-bottom-color: var(--text-color);
            font-weight: bold;
        }

        .tab-content {
            padding: 10px;
            flex-grow: 1; /* Allow content to fill available space in bottom panel */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* Shop Items */
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.2s;
        }

        .shop-item:hover {
            background-color: #252525;
        }

        .shop-item.selected {
            border-color: var(--accent-color);
            background-color: #2e3b2e;
        }

        .shop-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #151515;
        }

        .shop-icon {
            font-size: 1.4rem;
            margin-right: 12px;
            width: 36px;
            text-align: center;
        }

        .shop-info {
            flex-grow: 1;
        }

        .shop-name {
            font-weight: bold;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 2px;
        }

        .shop-cost {
            font-size: 0.75rem;
            color: #aaa;
        }

        /* Stats */
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-item {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .stats-icon {
            font-size: 1.4rem;
            margin-right: 12px;
            width: 36px;
            text-align: center;
        }

        .stats-info {
            flex-grow: 1;
        }

        .stats-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        .stats-value {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-color);
        }

        /* Achievements */
        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .achievement-item.unlocked {
            border-color: #FFD700;
            background-color: #2e2a1e;
        }

        .ach-icon {
            font-size: 1.4rem;
            margin-right: 12px;
            width: 36px;
            text-align: center;
        }

        .ach-info {
            flex-grow: 1;
        }

        .ach-name {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .ach-desc {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        .ach-reward {
            font-size: 0.7rem;
            color: #FFD700;
            font-weight: bold;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px; /* Above bottom panel */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        /* Harvest All Button */
        .harvest-all-btn {
            position: fixed;
            bottom: 150px; /* Above the bottom panel */
            right: 20px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 90;
            display: none; /* Controlled by JS */
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .harvest-all-btn:active {
            transform: scale(0.95);
        }

        /* Shop Headers */
        .shop-section-header {
            font-size: 0.85rem;
            color: #888;
            margin: 5px 0;
            padding-left: 5px;
            border-left: 3px solid var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="top-bar">
            <div class="level-info">
                <div class="level-badge">Lv.<span id="level">1</span></div>
                <div class="level-exp-bar">
                    <div id="exp-fill" class="level-exp-fill" style="width: 0%;"></div>
                </div>
                <div class="level-exp-text"><span id="exp">0</span>/<span id="max-exp">100</span></div>
            </div>
            <h1 class="game-title">放置农场</h1>
            <div class="currency">💰 <span id="gold">0</span></div>
        </header>

        <!-- Main Game Area (Grid) -->
        <main id="farm-grid" class="farm-grid">
            <!-- Plots will be generated by JS -->
        </main>

        <!-- Bottom UI -->
        <div class="bottom-panel">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="shop">商店</button>
                <button class="tab-btn" data-tab="stats">统计</button>
                <button class="tab-btn" data-tab="achievements">成就</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Shop Content -->
                <div id="shop-tab" class="tab-pane active">
                    <div id="shop-items" class="shop-list">
                        <!-- Shop items generated by JS -->
                    </div>
                </div>

                <!-- Stats Content -->
                <div id="stats-tab" class="tab-pane">
                    <p>暂无统计数据</p>
                </div>

                <!-- Achievements Content -->
                <div id="achievements-tab" class="tab-pane">
                    <p>暂无成就</p>
                </div>
            </div>
        </div>
    </div>

    <div id="message-toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
