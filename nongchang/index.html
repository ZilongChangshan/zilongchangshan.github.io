<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的农场</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>我的农场</h1>
            <div class="stats">
                <span id="gold">金币: 0</span>
                <span id="level">等级: 1</span>
                <span id="exp">经验: 0</span>
            </div>
        </header>

        <main id="farm-grid">
            <!-- 土地格子将由 JavaScript 生成 -->
        </main>

        <div class="controls">
            <button id="btn-plant" class="active">种植</button>
            <button id="btn-harvest">收获</button>
            <button id="btn-shop">商店</button>
        </div>

        <div id="message-area">欢迎来到农场！</div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>种子商店</h2>
            <div id="shop-items">
                <!-- Shop items will be generated here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
